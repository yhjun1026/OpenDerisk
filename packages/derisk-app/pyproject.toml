[project]
name = "derisk-app"
version = "0.7.0"
description = "Add your description here"
authors = [
    { name = "csunny", email = "cfqcsunny@gmail.com" }
]
license = "MIT"
readme = "README.md"
requires-python = ">= 3.10"

dependencies = [
#    "derisk-acc-auto",
    # derisk-app is the runnable webserver application; it requires the full
    # runtime stack (fastapi/uvicorn/jinja2/psutil/agent/framework/code) to
    # start. These were previously gated behind the optional `base` extra,
    # which caused `derisk quickstart` to crash with ModuleNotFoundError when
    # installed without extras. Fold them into hard dependencies so a bare
    # `uv sync --all-packages --frozen` produces a working server.
    "derisk[client,cli,agent,simple_framework,framework,code]",
    "derisk-ext",
    "derisk-serve",
    "derisk-client",
    "aiofiles",
    "pyparsing",
    "aiosqlite",
    "bcrypt>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/derisk-ai/derisk"
Documentation = "http://docs.derisk.ai/docs/overview"
Repository = "https://github.com/derisk-ai/derisk.git"
Issues = "https://github.com/derisk-ai/derisk/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
cache = [
    "rocksdict",
]

observability = [
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
]
derisks = [
    # For build derisks apps, we will be removed in the future.
    "build",
    "poetry"
]

[tool.uv]
managed = true
dev-dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/derisk_app"]
exclude = [
    "src/derisk_app/**/tests",
    "src/derisk_app/**/tests/*",
    "src/derisk_app/tests",
    "src/derisk_app/tests/*",
    "src/derisk_app/**/examples",
    "src/derisk_app/**/examples/*"
]

