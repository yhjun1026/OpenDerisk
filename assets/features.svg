<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f1a2e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>

  <text x="600" y="50" text-anchor="middle" fill="#f8fafc" font-size="26" font-weight="700">OpenDerisk — Core Features</text>
  <text x="600" y="76" text-anchor="middle" fill="#94a3b8" font-size="14">A future-oriented Multi-Agent development &amp; runtime framework</text>

  <!-- Card grid 4x2 -->
  <!-- Row 1 -->
  <g>
    <rect x="60" y="110" width="510" height="130" rx="14" fill="#172554" stroke="#3b82f6" stroke-opacity="0.4"/>
    <circle cx="104" cy="156" r="22" fill="#2563eb"/>
    <text x="104" y="163" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">1</text>
    <text x="142" y="150" fill="#dbeafe" font-size="18" font-weight="700">Multi-Agent Builder</text>
    <text x="142" y="174" fill="#93c5fd" font-size="12">Prompt writing · Context orchestration · Model tuning</text>
    <text x="142" y="194" fill="#94a3b8" font-size="12">Skills / MCP binding · Knowledge · Memory · Debug preview</text>
    <text x="142" y="214" fill="#64748b" font-size="11">Build &amp; debug agents in a three-pane editor</text>
  </g>
  <g>
    <rect x="630" y="110" width="510" height="130" rx="14" fill="#3b0764" stroke="#8b5cf6" stroke-opacity="0.4"/>
    <circle cx="674" cy="156" r="22" fill="#8b5cf6"/>
    <text x="674" y="163" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">2</text>
    <text x="712" y="150" fill="#ede9fe" font-size="18" font-weight="700">Workspace · Scenario Space</text>
    <text x="712" y="174" fill="#c4b5fd" font-size="12">Value-delivery centric · Visible achievement path</text>
    <text x="712" y="194" fill="#94a3b8" font-size="12">Tasks · Artifacts · Deliveries · Playbooks · Triggers</text>
    <text x="712" y="214" fill="#64748b" font-size="11">The AI-Native home page replacing the old chat entry</text>
  </g>

  <!-- Row 2 -->
  <g>
    <rect x="60" y="258" width="510" height="130" rx="14" fill="#083344" stroke="#0891b2" stroke-opacity="0.4"/>
    <circle cx="104" cy="304" r="22" fill="#0891b2"/>
    <text x="104" y="311" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">3</text>
    <text x="142" y="298" fill="#cffafe" font-size="18" font-weight="700">ReActMasterAgent</text>
    <text x="142" y="322" fill="#67e8f9" font-size="12">Long-horizon task engine · Doom-loop detection</text>
    <text x="142" y="342" fill="#94a3b8" font-size="12">Compaction · Truncation · History pruning · Phased prompts</text>
    <text x="142" y="362" fill="#64748b" font-size="11">WorkLog · Report generation · Kanban task planning</text>
  </g>
  <g>
    <rect x="630" y="258" width="510" height="130" rx="14" fill="#451a03" stroke="#d97706" stroke-opacity="0.4"/>
    <circle cx="674" cy="304" r="22" fill="#d97706"/>
    <text x="674" y="311" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">4</text>
    <text x="712" y="298" fill="#fef3c7" font-size="18" font-weight="700">ECP Semantic Layer</text>
    <text x="712" y="322" fill="#fcd34d" font-size="12">Trustworthy text2SQL &amp; data analysis</text>
    <text x="712" y="342" fill="#94a3b8" font-size="12">Hard semantics (entity/metric/relation) + soft wiki</text>
    <text x="712" y="362" fill="#64748b" font-size="11">AI proposes · Human confirms · Versioned &amp; gated</text>
  </g>

  <!-- Row 3 -->
  <g>
    <rect x="60" y="406" width="510" height="130" rx="14" fill="#052e16" stroke="#16a34a" stroke-opacity="0.4"/>
    <circle cx="104" cy="452" r="22" fill="#16a34a"/>
    <text x="104" y="459" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">5</text>
    <text x="142" y="446" fill="#bbf7d0" font-size="18" font-weight="700">Knowledge Vault</text>
    <text x="142" y="470" fill="#86efac" font-size="12">Full RAG pipeline · Vector / Graph / Full-text stores</text>
    <text x="142" y="490" fill="#94a3b8" font-size="12">Chroma · Milvus · PGVector · Neo4j · Elastic</text>
    <text x="142" y="510" fill="#64748b" font-size="11">S3 / OSS file storage · Retrieval configuration</text>
  </g>
  <g>
    <rect x="630" y="406" width="510" height="130" rx="14" fill="#1c1917" stroke="#a8a29e" stroke-opacity="0.4"/>
    <circle cx="674" cy="452" r="22" fill="#78716c"/>
    <text x="674" y="459" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">6</text>
    <text x="712" y="446" fill="#e7e5e4" font-size="18" font-weight="700">Tools · Skills · MCP</text>
    <text x="712" y="470" fill="#d6d3d1" font-size="12">Local tools · Reusable skill packs · MCP protocol</text>
    <text x="712" y="490" fill="#94a3b8" font-size="12">FileSystem · Shell · Sandbox · Schedule · Todo</text>
    <text x="712" y="510" fill="#64748b" font-size="11">Bring your own tools and external MCP servers</text>
  </g>

  <!-- Row 4 -->
  <g>
    <rect x="60" y="554" width="510" height="130" rx="14" fill="#3b0764" stroke="#a855f7" stroke-opacity="0.4"/>
    <circle cx="104" cy="600" r="22" fill="#a855f7"/>
    <text x="104" y="607" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">7</text>
    <text x="142" y="594" fill="#f3e8ff" font-size="18" font-weight="700">Media Generation</text>
    <text x="142" y="618" fill="#d8b4fe" font-size="12">Image &amp; video generation as agent tools</text>
    <text x="142" y="638" fill="#94a3b8" font-size="12">OpenAI · Wanxiang · Google Banana · Seedance · Sora</text>
    <text x="142" y="658" fill="#64748b" font-size="11">Delivered via Artifact / d-attach in the workspace</text>
  </g>
  <g>
    <rect x="630" y="554" width="510" height="130" rx="14" fill="#7c2d12" stroke="#ea580c" stroke-opacity="0.4"/>
    <circle cx="674" cy="600" r="22" fill="#ea580c"/>
    <text x="674" y="607" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">8</text>
    <text x="712" y="594" fill="#ffedd5" font-size="18" font-weight="700">Built-in Scenarios</text>
    <text x="712" y="618" fill="#fdba74" font-size="12">AI-SRE (OpenRCA) · DataExpert · Flame Graph</text>
    <text x="712" y="638" fill="#94a3b8" font-size="12">Ready-to-use scenarios · Open &amp; extensible</text>
    <text x="712" y="658" fill="#64748b" font-size="11">General · Coding · Python-Expert scene profiles</text>
  </g>
</svg>
